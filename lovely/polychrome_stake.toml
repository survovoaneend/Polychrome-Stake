position = "before"
match_indent = true
payload = '''
if PolychromeStake and PolychromeStake.active then
    local pstake_force_gladiator = PolychromeStake.gladiator_active()
    for k, v in pairs(eligible_bosses) do
        if v and G.P_BLINDS[k] and G.P_BLINDS[k].boss and PolychromeStake.is_gladiator(G.P_BLINDS[k]) ~= pstake_force_gladiator then
            eligible_bosses[k] = nil
        end
    end
end
'''

# create_UIBox_your_collection_blinds()
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/overrides.lua"]'
pattern = 'for i, v in ipairs(blind_tab) do'
position = "before"
match_indent = true
payload = '''
local pstake_gladiator_discovered = false
if PolychromeStake and PolychromeStake.active then
    for i = #blind_tab, 1, -1 do
        local v = blind_tab[i]
        local is_gladiator = PolychromeStake.is_gladiator(v)
        if is_gladiator and v.discovered then
            pstake_gladiator_discovered = true
        end
        if is_gladiator ~= (G.GAME.pstake_gladiator_tab or false) then
            table.remove(blind_tab, i)
        end
    end
    blinds_amt = #blind_tab
end
