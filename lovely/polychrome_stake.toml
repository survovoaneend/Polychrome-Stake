[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Lock polychrome stake behind gold stake
# (This patch will eventually be unnecessary)
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_objects/runselectpage.lua"]'
pattern = "if save_data and save_data[stake.key] then"
position = "before"
payload = '''
if stake.key == 'stake_pstake_polychrome' and not save_data['stake_gold'] and not G.PROFILES[G.SETTINGS.profile].all_unlocked then
    unlocked = false
end
'''
match_indent = true

# Add polychrome shader to polychrome chip
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_objects/runselectpage.lua"]'
pattern = "if card.config.center.shiny then Sprite.draw_shader(_sprite, 'voucher', nil, _sprite.ARGS.send_to_shader) end"
position = "after"
payload = '''
if stake_key == 'stake_pstake_polychrome' then Sprite.draw_shader(_sprite, 'polychrome', nil, _sprite.ARGS.send_to_shader) end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_objects/runselectpage.lua"]'
pattern = "if card.config.center.shiny then Sprite.draw_shader(_sprite, 'negative_shine', nil, _sprite.ARGS.send_to_shader) end"
position = "after"
payload = '''
if stake_key == 'stake_pstake_polychrome' and unlocked then Sprite.draw_shader(_sprite, 'polychrome', nil, _sprite.ARGS.send_to_shader) end
'''
match_indent = true

# Offset modifier tooltips upwards
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/overrides.lua"]'
pattern = "(self.params.run_select_selection_choice and self.params.stake) and 'bm' or"
position = "after"
payload = '''
(self.params.pstake_poly_chip) and 'tm' or
'''
match_indent = true

# Allow hovering over the chips in the poly stake tower
[[patches]]
[patches.pattern]
target = "engine/controller.lua"
pattern = "if self.hovering.target and self.hovering.target.role and self.hovering.target.role.major and self.hovering.target.role.major.params and self.hovering.target.role.major.params.stake and self.hovering.target ~= self.hovering.prev_target then self.hovering.target.role.major:hover() end"
position = "after"
payload = '''
if self.hovering.prev_target and self.hovering.prev_target.role and self.hovering.prev_target.role.major and self.hovering.prev_target.role.major.params and self.hovering.prev_target.role.major.params.pstake_poly_chip and self.hovering.target ~= self.hovering.prev_target then self.hovering.prev_target.role.major:stop_hover() end
if self.hovering.target and self.hovering.target.role and self.hovering.target.role.major and self.hovering.target.role.major.params and self.hovering.target.role.major.params.pstake_poly_chip and self.hovering.target ~= self.hovering.prev_target then self.hovering.target.role.major:hover() end
'''
match_indent = true

# Fix locked description for polychrome stake
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils/run_select.lua"]'
pattern = "local split = SMODS.split_string(string_output)"
position = "before"
payload = '''
if self.config.center.key == 'stake_pstake_polychrome' then
    string_output = string_output .. localize({type='name_text', set='Stake', key='stake_gold'})
end
'''
match_indent = true

# Localize variables in polychrome sticker tooltip
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.sticker or ((self.sticker_run and self.sticker_run~='NONE') and G.SETTINGS.run_stake_stickers)  then loc_vars = loc_vars or {}; loc_vars.sticker=(self.sticker or self.sticker_run) end"
position = "after"
payload = '''
if PolychromeStake and PolychromeStake.active and self.pstake_poly_sticker and G.SETTINGS.run_stake_stickers then
    loc_vars = loc_vars or {}
    loc_vars.pstake_poly_sticker = true
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if specific_vars and specific_vars.sticker then info_queue[#info_queue+1] = {key = string.lower(specific_vars.sticker)..'_sticker', set = 'Other'} end        "
position = "after"
payload = '''
if PolychromeStake and PolychromeStake.active and specific_vars and specific_vars.pstake_poly_sticker then
    local points = G.PROFILES[G.SETTINGS.profile].joker_usage[_c.key] and G.PROFILES[G.SETTINGS.profile].joker_usage[_c.key].pstake_poly_points or 0
    info_queue[#info_queue + 1] = {key = 'pstake_polychrome_sticker', set = 'Other', vars = {points}}
end
'''
match_indent = true

# Give polychrome sticker
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "self.sticker_run = get_joker_win_sticker(self.config.center) or 'NONE'"
position = "after"
payload = '''
if PolychromeStake and PolychromeStake.active and (G.PROFILES[G.SETTINGS.profile].joker_usage[self.config.center.key] and G.PROFILES[G.SETTINGS.profile].joker_usage[self.config.center.key].pstake_poly_points or 0) > 0 then
    self.pstake_poly_sticker = true
end
'''
match_indent = true

# Draw polychrome sticker
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.ability.name == 'The Soul' and (self.config.center.discovered or self.bypass_discovery_center) then"
position = "before"
payload = '''
if PolychromeStake and PolychromeStake.active and self.pstake_poly_sticker and G.SETTINGS.run_stake_stickers then
    G.shared_stickers['pstake_polychrome'].role.draw_major = self
    G.shared_stickers['pstake_polychrome']:draw_shader('dissolve', nil, nil, nil, self.children.center)
    G.shared_stickers['pstake_polychrome']:draw_shader('polychrome', nil, self.ARGS.send_to_shader, nil, self.children.center)
end

'''
match_indent = true

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/card_draw.lua"]'
pattern = "for k, v in pairs(SMODS.Stickers) do"
position = "before"
payload = '''
if PolychromeStake and PolychromeStake.active and self.pstake_poly_sticker and G.SETTINGS.run_stake_stickers then
    G.shared_stickers['pstake_polychrome'].role.draw_major = self
    G.shared_stickers['pstake_polychrome']:draw_shader('dissolve', nil, nil, nil, self.children.center)
    G.shared_stickers['pstake_polychrome']:draw_shader('polychrome', nil, self.ARGS.send_to_shader, nil, self.children.center)
end

'''
match_indent = true

# Remove polychrome stake from counting towards profile progress
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "G.PROGRESS.deck_stakes.of = G.PROGRESS.deck_stakes.of + #G.P_CENTER_POOLS.Stake"
position = "after"
payload = '''
if PolychromeStake and PolychromeStake.active and G.P_STAKES['stake_pstake_polychrome'] then G.PROGRESS.deck_stakes.of = G.PROGRESS.deck_stakes.of - 1 end -- don't count Polychrome stake
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "G.PROGRESS.joker_stickers.of = G.PROGRESS.joker_stickers.of + #G.P_CENTER_POOLS.Stake"
position = "after"
payload = '''
if PolychromeStake and PolychromeStake.active and G.P_STAKES['stake_pstake_polychrome'] then G.PROGRESS.joker_stickers.of = G.PROGRESS.joker_stickers.of - 1 end -- don't count Polychrome stake
'''
match_indent = true


[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "-- TARGET: add your own individual scoring targets"
position = "after"
payload = '''
if PolychromeStake and PolychromeStake.active and G.GAME.pstake_poly_chips then
    for _, v in ipairs(PolychromeStake.PolyStakeChip.obj_buffer) do
        if G.GAME.pstake_poly_chips[v] and G.GAME.pstake_poly_chips[v] > 0 then
            t[#t + 1] = { object = PolychromeStake.PolyStakeChips[v], scored_card = G.deck and G.deck.cards[1] or G.deck, set = "PolyStakeChips", key = v }
        end
    end
end
'''
match_indent = true

# Mint condition
# Card:set_cost()
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "self.cost = math.max(1, math.floor((self.base_cost + self.extra_cost + 0.5)*(100-G.GAME.discount_percent)/100))"
position = "after" 
match_indent = true
payload = '''
if self.ability.pstake_mint_condition then self.cost = self.cost + 10 end
'''

# eval_card()
[[patches]]
[patches.regex]
target = "functions/common_events.lua"
pattern = "if card.ability.rental then"
position = "before"
match_indent = true
payload = '''
if PolychromeStake and PolychromeStake.active then
    local pstake_ret = {}
    for _, k in ipairs(SMODS.Sticker.obj_buffer) do
        local v = SMODS.Stickers[k]
        if v.pstake_calc_debuff then
            local sticker = card:calculate_sticker(context, k)
            if sticker then
                pstake_ret[v] = sticker
            end
        end
    end
    if next(pstake_ret) then
        if card.ability.rental then
            local rental = card:calculate_sticker(context, 'rental')
            if rental then pstake_ret[SMODS.Stickers.rental] = rental end
        end
        return pstake_ret, {}
    end
end
'''


# generate_card_ui()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "elseif specific_vars.playing_card then"
position = "before"
match_indent = true
payload = '''
elseif (PolychromeStake and PolychromeStake.active and card and card.ability and card.ability.pstake_deadwood_blank) then
    full_UI_table.name = {}
    localize{type = 'other', key = 'pstake_blank_playing_card', set = 'Other', nodes = full_UI_table.name}
    full_UI_table.name = full_UI_table.name[1]
'''



# create_UIBox_blind_choice()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "elseif not run_info then"
position = "before"
match_indent = true
payload = """
elseif type == 'Big_Boss' and G.GAME.pstake_has_big_boss then
  if not blind_choice.config.unskippable and G.GAME.round_resets.blind_states['Big_Boss'] ~= 'Defeated' then extras = create_UIBox_blind_tag(type, run_info) end
"""

# end_round()
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "SMODS.calculate_context({end_of_round = true, game_over = game_over, beat_boss = G.GAME.blind.boss*"
position = "before"
match_indent = true
payload = """
if G.GAME.pstake_has_big_boss and G.GAME.blind_on_deck == 'Big_Boss' then
    G.GAME.pstake_temp_big_boss = true
end
"""

# create_UIBox_blind_select()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "G.blind_select_opts = {}"
position = "after"
match_indent = true
payload = """
if (PolychromeStake and PolychromeStake.active) and G.GAME.pstake_has_big_boss then
    if G.GAME.blind_on_deck == 'Boss' and G.GAME.round_resets.blind_states.Big_Boss and not (G.GAME.round_resets.blind_states.Big_Boss == 'Defeated' or G.GAME.round_resets.blind_states.Big_Boss == 'Skipped' or G.GAME.round_resets.blind_states.Big_Boss == 'Hide') then
        G.GAME.blind_on_deck = 'Big_Boss'
        G.GAME.round_resets.blind_states['Big_Boss'] = 'Select'
        G.GAME.round_resets.blind_states['Boss'] = 'Upcoming'
        G.GAME.round_resets.loc_blind_states.Big_Boss = localize(G.GAME.round_resets.blind_states.Big_Boss or 'Upcoming','blind_states')
    end
    G.GAME.round_resets.blind_states['Big'] = 'Hide'
    if G.GAME.round_resets.blind_states['Big_Boss'] ~= 'Hide' then
        G.blind_select_opts.big_boss = UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={UIBox_dyn_container({create_UIBox_blind_choice('Big_Boss')},false,get_blind_main_colour('Big_Boss'), mix_colours(G.C.BLACK, get_blind_main_colour('Big_Boss'), 0.8))}}, config = {align="bmi", offset = {x=0,y=0}}}
    end
end
"""

# create_UIBox_blind_select()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "G.GAME.round_resets.blind_states['Big'] ~= 'Hide' and {n=G.UIT.O, config={align = \"cm\", object = G.blind_select_opts.big}} or nil,"
position = "after"
match_indent = true
payload = """
G.GAME.pstake_has_big_boss and G.GAME.round_resets.blind_states['Big_Boss'] ~= 'Hide' and G.blind_select_opts.big_boss and {n=G.UIT.O, config={align = "cm", object = G.blind_select_opts.big_boss}} or nil,
"""

# reset_blinds()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "SMODS.reset_blind_choices(G.GAME.round_resets.blind_choices)"
position = "before"
match_indent = true
payload = """
if G.GAME.pstake_has_big_boss then
    G.GAME.round_resets.blind_states.Big_Boss = 'Upcoming'
    G.GAME.round_resets.blind_states['Big'] = 'Hide'
end
"""

# SMODS.reset_blind_choices()
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_objects/blind.lua"]'
pattern = "G.GAME.round_resets.blind_order = {'Small', 'Big', 'Boss'} -- prepared for custom antes"
position = "after"
match_indent = true
payload = """
if G.GAME.pstake_has_big_boss then
    G.GAME.round_resets.blind_order = {'Small', 'Big_Boss', 'Boss'}
end
"""


# G.FUNCS.cash_out()
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.GAME.round_resets.blind_tags.Big = get_next_tag_key()"
position = "after"
match_indent = true
payload = """
if (PolychromeStake and PolychromeStake.active) and G.GAME.pstake_has_big_boss then
    G.GAME.round_resets.blind_tags.Big_Boss = G.GAME.round_resets.blind_tags.Big
end
"""

# end_round()
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = """elseif G.GAME.round_resets.blind_states.Big == 'Current' then
    G.GAME.round_resets.blind_states.Big = 'Defeated'"""
position = 'before'
match_indent = true
payload = """
elseif G.GAME.pstake_temp_big_boss then
    G.GAME.round_resets.blind_states.Big_Boss = 'Defeated'
    G.GAME.pstake_temp_big_boss = nil
"""

# new_round()
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = """elseif G.GAME.round_resets.blind_states.Big == 'Current' then
    G.GAME.round_resets.blind_states.Big = 'Current'"""
position = 'before'
match_indent = true
payload = """
elseif G.GAME.pstake_has_big_boss and G.GAME.round_resets.blind_states.Big_Boss == 'Current' then
    blhash = 'B'
"""

# G.UIDEF.current_blinds()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = """G.GAME.round_resets.blind_states['Boss'] ~= 'Hide' and {n=G.UIT.C, config={align = "tm", padding = 0.1, outline = 2, r = 0.1, line_emboss = 0.2, outline_colour = G.C.BLACK}, nodes={"""
position = "before"
match_indent = true
payload = """
G.GAME.pstake_has_big_boss and G.GAME.round_resets.blind_states['Big_Boss'] ~= 'Hide' and {n=G.UIT.C, config={align = "tm", padding = 0.1, outline = 2, r = 0.1, line_emboss = 0.2, outline_colour = G.C.BLACK}, nodes={
    create_UIBox_blind_choice('Big_Boss', true)
}} or nil,
"""

# G.FUNCS.skip_blind()
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.GAME.blind_on_deck == 'Small' and 'Big' or G.GAME.blind_on_deck == 'Big' and 'Boss' or 'Boss'"
position = "before"
match_indent = true
payload = """
G.GAME.pstake_has_big_boss and (G.GAME.blind_on_deck == 'Small' and 'Big_Boss' or G.GAME.blind_on_deck == 'Big_Boss' and 'Boss' or 'Boss') or
"""

# get_blind_main_colour()
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "if blind == 'Boss' or blind == 'Small' or blind == 'Big' then"
position = "before"
match_indent = true
payload = """
if blind == 'Big_Boss' and (PolychromeStake and PolychromeStake.active) then
    G.GAME.round_resets.blind_states = G.GAME.round_resets.blind_states or {}
    if G.GAME.round_resets.blind_states[blind] == 'Defeated' or G.GAME.round_resets.blind_states[blind] == 'Skipped' then disabled = true end
    blind = G.GAME.round_resets.blind_choices[blind]
end
"""

# Game:update()
[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = "G.GAME.round_resets.loc_blind_states.Big = localize(G.GAME.round_resets.blind_states.Big,'blind_states')"
position = 'after'
match_indent = true
payload = """
if (PolychromeStake and PolychromeStake.active) and G.GAME.pstake_has_big_boss then
    G.GAME.round_resets.loc_blind_states.Big_Boss = localize(G.GAME.round_resets.blind_states.Big_Boss or 'Upcoming','blind_states')
end
"""



# create_UIBox_blind_choice()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "function create_UIBox_blind_choice(type, run_info)"
position = "after"
match_indent = true
payload = """
  local pstake_blindness = PolychromeStake and PolychromeStake.active and PolychromeStake.blindness_active() and (type == 'Boss' or type == 'Big_Boss')
"""

# SMODS src/ui.lua: create_UIBox_blind_choice()
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/ui.lua"]'
pattern = "function create_UIBox_blind_choice(type, run_info)"
position = "after"
match_indent = true
payload = """
    local pstake_blindness = PolychromeStake and PolychromeStake.active and PolychromeStake.blindness_active() and (type == 'Boss' or type == 'Big_Boss')
"""

# create_UIBox_blind_choice()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = """
for k, v in ipairs(text_table) do
    blind_desc_nodes[#blind_desc_nodes+1] = {n=G.UIT.R, config={align = "cm", maxw = 2.8}, nodes=SMODS.localize_box(v, {default_col = disabled and G.C.UI.TEXT_INACTIVE or target.text_colour or G.C.WHITE, shadow = not disabled, vars = target.vars, scale = target.scale})}
end
"""
position = "after"
match_indent = true
payload = """
if pstake_blindness then
    for i = #blind_desc_nodes, 1, -1 do blind_desc_nodes[i] = nil end
    blind_desc_nodes[1] = {n=G.UIT.R, config={align = "cm", maxw = 2.8}, nodes={
        {n=G.UIT.T, config={text = "???", scale = 0.32, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.WHITE, shadow = not disabled}}
    }}
    blind_col = G.C.UI.TEXT_INACTIVE
end
"""

# create_UIBox_blind_choice()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = """ {n=G.UIT.R, config={id = 'blind_name',align = "cm", padding = 0.07}, nodes={
    {n=G.UIT.R, config={align = "cm", r = 0.1, outline = 1, outline_colour = blind_col, colour = darken(blind_col, 0.3), minw = 2.9, emboss = 0.1, padding = 0.07, line_emboss = 1}, nodes={
        {n=G.UIT.O, config={object = DynaText({string = loc_name, colours = {disabled and G.C.UI.TEXT_INACTIVE or G.C.WHITE}, shadow = not disabled, float = not disabled, y_offset = -4, scale = 0.45, maxw =2.8})}},
    }},
}},
"""
position = "before"
match_indent = true
payload = """
pstake_blindness and {n=G.UIT.R, config={id = 'blind_name',align = "cm", padding = 0.07}, nodes={
    {n=G.UIT.R, config={align = "cm", r = 0.1, outline = 1, outline_colour = G.C.UI.TEXT_INACTIVE, colour = darken(G.C.UI.TEXT_INACTIVE, 0.3), minw = 2.9, emboss = 0.1, padding = 0.07, line_emboss = 1}, nodes={
        {n=G.UIT.O, config={object = DynaText({string = "???", colours = {disabled and G.C.UI.TEXT_INACTIVE or G.C.WHITE}, shadow = not disabled, float = not disabled, y_offset = -4, scale = 0.45, maxw =2.8})}},
    }},
}} or
"""

# create_UIBox_blind_choice() (pstake_blindness is nil in any other function this line appears in)
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{n=G.UIT.T, config={text = number_format(blind_amt)*"
position = "before"
match_indent = true
payload = """
pstake_blindness and {n=G.UIT.T, config={text = "???", scale = 0.6, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.RED, shadow = not disabled}} or
"""

# create_UIBox_blind_choice()
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = """ _reward and {n=G.UIT.R, config={align = "cm"}, nodes={
    {n=G.UIT.T, config={text = localize('ph_blind_reward'), scale = 0.35, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.WHITE, shadow = not disabled}},
    {n=G.UIT.T, config={text = string.rep(localize("$"), blind_choice.config.dollars)..'+', scale = 0.35, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.MONEY, shadow = not disabled}}
}} or nil,
"""
position = "before"
match_indent = true
payload = """
pstake_blindness and _reward and {n=G.UIT.R, config={align = "cm"}, nodes={
    {n=G.UIT.T, config={text = localize('ph_blind_reward'), scale = 0.35, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.WHITE, shadow = not disabled}},
    {n=G.UIT.T, config={text = "???", scale = 0.35, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.MONEY, shadow = not disabled}}
}} or
"""

# create_UIBox_blind_choice()
[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = '''
(?<indent>[\t ]*)function create_UIBox_blind_choice\(.*
(?:.|\n)*?
[\t ]*blind_choice\.animation = .*
'''
position = "after"
line_prepend = '$indent'
payload = """
  if pstake_blindness then
      blind_choice.animation = SMODS.create_sprite(0,0, 1.4, 1.4, "pstake_blind_drawn_replacement",  { x = 0, y = 0 })
      if blind_choice.config.boss_colour ~= G.C.UI.TEXT_INACTIVE then
          blind_choice.config.pstake_old_boss_colour = blind_choice.config.boss_colour
          blind_choice.config.boss_colour = G.C.UI.TEXT_INACTIVE
      end
  elseif blind_choice.config.pstake_old_boss_colour ~= nil then
      blind_choice.config.boss_colour = blind_choice.config.pstake_old_boss_colour
      blind_choice.config.pstake_old_boss_colour = nil
  end
"""

# SMODS src/ui.lua: create_UIBox_blind_choice()
[[patches]]
[patches.regex]
target = '=[SMODS _ "src/ui.lua"]'
pattern = '''
(?<indent>[\t ]*)function create_UIBox_blind_choice\(.*
(?:.|\n)*?
.*(?<root>blind.mod)'''
root_capture = "$root"
position = "at"
line_prepend = '$indent'
payload = "(blind.mod and not pstake_blindness)"
times = 1

# SMODS.create_blind_pool()
[[patches]]
